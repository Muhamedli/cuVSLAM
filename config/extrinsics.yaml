# ==============================================================================
# CAMERA EXTRINSICS CONFIGURATION (Transforms)
# ==============================================================================
# Key format: rig_from_cam_X (where X is the camera index)
# translation: [x, y, z] in meters
# rotation: quaternion [x, y, z, w]

transforms:
  rig_from_cam_0:
    translation: [0.0, 0.0, 0.0]
    rotation: [0.0, 0.0, 0.0, 1.0]
  rig_from_cam_1:
    translation: [0.12, 0.0, 0.0]
    rotation: [0.0, 0.0, 0.0, 1.0]

